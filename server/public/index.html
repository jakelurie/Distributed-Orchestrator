<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#14161a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Distributed Orchestrator" />
    <title>Distributed Orchestrator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="network-gate" role="alertdialog" aria-modal="true" aria-labelledby="network-gate-title">
      <h2 id="network-gate-title">Checking Tailscale</h2>
      <p id="network-gate-message">Waiting for this computer’s connection…</p>
    </div>
    <header id="bar">
      <button id="menu" class="tap" aria-label="Apps">☰</button>
      <div id="title">
        <div id="title-name">Distributed Orchestrator</div>
        <div id="title-sub">pick a session</div>
      </div>
      <button id="usage" class="tap" aria-label="Usage">📊</button>
      <button id="gear" class="tap" aria-label="Distributed Orchestrator settings">🔧</button>
    </header>

    <nav id="session-tabs" aria-label="App sessions" hidden></nav>

    <div id="banner" hidden></div>

    <div id="working" hidden>
      <span class="pulse"></span>
      <span>working</span>
      <span id="working-time" class="mono"></span>
    </div>

    <main id="transcript">
      <div class="empty">
        <p>no session open</p>
        <p class="dim">tap ☰ for your apps &amp; sessions</p>
      </div>
    </main>

    <div id="pending" hidden></div>


    <footer id="composer">
      <textarea id="input" rows="1" placeholder="Describe what to build…" enterkeyhint="send"></textarea>
      <input id="pick" type="file" accept="image/*,.pdf,.txt,.md,.csv,.json,.html,.xml,.rtf,.docx" multiple hidden />
      <button id="attach" class="ghost attach-btn" aria-label="Attach a photo">＋</button>
      <button id="dictate" class="ghost attach-btn" aria-label="Record voice message" title="Dictate a message">🎙</button>
      <button id="send" class="primary">send</button>
      <button id="queue" class="primary" hidden title="Run this message after the current turn; Stop cancels it">queue</button>
      <button id="stop" class="danger" hidden>stop</button>
    </footer>

    <div id="sheet-back" hidden><section id="sheet"></section></div>

    <script src="cluster-client.js"></script>
    <script src="app.js"></script>
    <script src="voice.js"></script>
  </body>
</html>
